<div class="container py-3">
  <div class="row">
    <div class="col-12">
      <div class="card-glass rounded-4 shadow-sm overflow-hidden">

        <!-- Header -->
        <div class="px-3 px-md-4 py-3 border-bottom border-soft">
          <div class="fw-semibold ">
            Вопросы
          </div>
        </div>

        <!-- List -->
        <div class="px-3 px-md-4 py-2">
          <table class="table table-borderless mb-0 align-middle bg-transparent">
            <tbody class="bg-transparent">
            <tr
              *ngFor="let question of questions; let idx = index"
              class="border-bottom border-soft bg-transparent"
              style="cursor: pointer;"
              (click)="linkQuestion(topic?.id, question?.id)"
            >
              <td class="py-3 bg-transparent">
                <div class="d-flex align-items-start gap-2">
                  <i class="bi bi-patch-question mt-1 text-muted-soft"></i>

                  <div class="min-w-0">
                    <div class="fw-semibold  mb-2">
                      {{ question?.title }}
                    </div>

                    <div class="d-flex flex-wrap align-items-center gap-2 small text-muted-soft">
                      <!-- Status -->
                      <ng-container *ngIf="status">
                          <span
                            *ngIf="status[question?.id] === 1 || !status[question?.id]"
                            class="badge rounded-pill badge-accent"
                          >
                            Слабый
                          </span>
                        <span
                          *ngIf="status[question?.id] === 2"
                          class="badge rounded-pill badge-warn"
                        >
                            Средний
                          </span>
                        <span
                          *ngIf="status[question?.id] === 3"
                          class="badge rounded-pill badge-good"
                        >
                            Сильный
                          </span>
                      </ng-container>

                      <!-- Level -->
                      <span class="badge rounded-pill badge-glass">
                          {{ question?.level?.toLowerCase() }}
                        </span>

                      <!-- Views -->
                      <span *ngIf="views" class="d-inline-flex align-items-center gap-1">
                          <i class="bi bi-eye"></i>
                          {{ views[question?.id] }}
                        </span>
                    </div>
                  </div>
                </div>
              </td>
            </tr>

            <tr *ngIf="!questions?.length" class="bg-transparent">
              <td class="text-center text-muted-soft py-4 bg-transparent">
                Вопросов пока нет
              </td>
            </tr>
            </tbody>
          </table>
        </div>
        <!-- /List -->

      </div>
    </div>
  </div>
</div>
