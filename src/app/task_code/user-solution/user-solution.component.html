<div class="container py-3">
  <div class="row">
    <div class="col-12">
      <div class="card-glass rounded-4 shadow-sm overflow-hidden">

        <!-- Header -->
        <div class="px-3 px-md-4 py-3 border-bottom border-soft">
          <div class="d-flex justify-content-between align-items-center gap-2">
            <div class="fw-semibold ">
              {{ sol.taskcode.name }}
            </div>

            <app-book-mark-star [name]="sol.taskcode.name"></app-book-mark-star>
          </div>
        </div>

        <!-- Body -->
        <div class="px-3 px-md-4 py-3">

          <!-- Description -->
          <div class="text-muted-soft mb-3"
               [innerHTML]="sol.taskcode.description">
          </div>

          <!-- Skeleton -->
          <div class="fw-semibold  mb-2">
            Каркас: <span class="text-muted-soft">{{ sol.taskcode.className }}</span>
          </div>

          <div class="mb-4">
            <ngx-codemirror
              [(ngModel)]="sol.taskcode.classCode"
              [options]="options"
            ></ngx-codemirror>
          </div>

          <!-- Solution -->
          <div class="fw-semibold  mb-2 d-flex align-items-center gap-2">
            <i class="bi bi-check2-square"></i>
            Решение
          </div>

          <div>
            <ngx-codemirror
              [(ngModel)]="sol.solution.code"
              [options]="options"
            ></ngx-codemirror>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
