<div class="container py-3">
  <!-- Filters -->
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <!-- Level dropdown -->
    <div class="dropdown">
      <button
        class="btn btn-sm border-soft dropdown-toggle"
        type="button"
        id="dropdownLevel"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        Уровень
      </button>
      <ul
        class="dropdown-menu  border-soft bg-glass"
        aria-labelledby="dropdownLevel"
      >
        <li *ngFor="let l of levels">
          <a class="dropdown-item" (click)="selectLevel(l)">{{ l.name }}</a>
        </li>
      </ul>
    </div>

    <!-- Selected level chip -->
    <button
      *ngIf="level"
      type="button"
      class="btn btn-sm border-soft d-inline-flex align-items-center gap-2"
      (click)="selectLevel()"
    >
      <span>{{ level.name }}</span>
      <i class="bi bi-x-lg"></i>
    </button>

    <!-- Category dropdown -->
    <div class="dropdown">
      <button
        class="btn btn-sm border-soft dropdown-toggle"
        type="button"
        id="dropdownCat"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        Блок
      </button>
      <ul
        class="dropdown-menu  border-soft bg-glass"
        aria-labelledby="dropdownCat"
      >
        <ng-container *ngFor="let c of currentCategories">
          <li *ngIf="c.upgradedId !== 0">
            <a
              class="dropdown-item text-decoration-line-through"
              (click)="selectCat(c)"
              title="Блок был обновлен. Подробности в разделе 'Главное меню / Блоки'."
            >
              {{ c.name }}
            </a>
          </li>
          <li *ngIf="c.upgradedId === 0">
            <a class="dropdown-item" (click)="selectCat(c)">{{ c.name }}</a>
          </li>
        </ng-container>
      </ul>
    </div>

    <!-- Selected category chip -->
    <button
      *ngIf="category"
      type="button"
      class="btn btn-sm border-soft d-inline-flex align-items-center gap-2"
      (click)="selectCat()"
      [class.text-decoration-line-through]="category?.upgradedId !== 0"
      [attr.title]="
        category?.upgradedId !== 0
          ? 'Блок был обновлен. Подробности в разделе \'Главное меню / Блоки\'.'
          : null
      "
    >
      <span>{{ category.name }}</span>
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- List -->
  <div class="card-glass rounded-4 shadow-sm overflow-hidden">
    <table class="table table-borderless mb-0 align-middle bg-transparent">
      <tbody class="bg-transparent">
      <tr *ngFor="let task of tasks" class="border-bottom border-soft bg-transparent">
        <td class="py-3 bg-transparent">
          <a class="text-decoration-none d-block" [routerLink]="['/exercise', task?.id]">
            <div class="fw-semibold d-flex align-items-center gap-2 mb-1">
              <i class="bi bi-folder"></i>
              <span class="">{{ task.name }}</span>
            </div>

            <div class="small text-muted-soft d-flex flex-wrap gap-2">
                <span class="badge rounded-pill badge-glass">
                  {{ task.level.name }}
                </span>

              <span
                class="badge rounded-pill badge-glass"
                *ngIf="task.category.upgradedId === 0"
              >
                  {{ task.category.name }}
                </span>

              <span
                class="badge rounded-pill badge-glass text-decoration-line-through"
                *ngIf="task.category.upgradedId !== 0"
                title="Блок был обновлен. Подробности в разделе 'Главное меню / Блоки'."
              >
                  {{ task.category.name }}
                </span>
            </div>
          </a>
        </td>

        <td class="py-3 bg-transparent" style="width: 260px;">
          <app-progress-bar-solutions [progress]="task.progress"></app-progress-bar-solutions>
        </td>
      </tr>

      <tr *ngIf="!tasks?.length" class="bg-transparent">
        <td class="text-center text-muted-soft py-4 bg-transparent" colspan="2">
          Ничего не найдено
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
