<div *ngIf="!edit">
  <div
    class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2 small"
  >
    <div class="d-flex flex-wrap align-items-center gap-2">
      <!-- Status -->
      <span
        *ngIf="message.status"
        class="badge"
        [ngClass]="{
          'badge-accent': message.status?.id == 1,
          'badge-good': message.status?.id == 3,
          'badge-warn': message.status?.id == 4
        }"
      >
        {{ message.status?.statusName }}
      </span>

      <!-- From / To -->
      <span class="text-muted-soft">
        Сообщение от
        <span class="fw-semibold ">
          {{ message.submitter.name }} [{{ message.submitter.mentor ? 'Ментор' : 'Ученик' }}]
        </span>
        к
        <span class="fw-semibold ">
          {{ message.handler.name }} [{{ !message.submitter.mentor ? 'Ментор' : 'Ученик' }}]
        </span>
      </span>
    </div>

    <!-- Right actions -->
    <div class="d-flex align-items-center gap-2">
      <span class="text-muted-soft">
        {{ message.message.timeMils | date: 'dd.MM.yyyy HH:mm' }}
      </span>

      <a
        *ngIf="message.submitter.id === user.id"
        class="btn btn-sm btn-link text-muted-soft p-0"
        title="Отправить решение сообществу"
        [routerLink]="['/solution_community', 'publish', 'task', message.message.id]"
      >
        <i class="bi bi-people"></i>
      </a>

      <button
        *ngIf="message.submitter.id === user.id"
        type="button"
        class="btn btn-sm btn-link text-muted-soft p-0"
        title="Отредактировать"
        (click)="editMessage()"
      >
        <i class="bi bi-pencil"></i>
      </button>
    </div>
  </div>

  <!-- TEXT (главный источник белого фона) -->
  <div class="text-wrap">
    <div
      class="text-muted-soft"
      [innerHTML]="message.message.text"
    ></div>
  </div>
</div>

<div *ngIf="edit">
  <app-redactor
    [text]="message.message.text"
    [titleLabel]="'Выполняется: Редактирование'"
    (outputEmitter)="updateComment($event)"
  ></app-redactor>

  <div
    class="d-flex flex-wrap gap-2 mt-2"
  >
    <button
      type="button"
      class="btn btn-sm btn-j-primary"
      [disabled]="!newText"
      (click)="update()"
    >
      Сохранить
    </button>

    <button
      type="button"
      class="btn btn-sm border-soft"
      (click)="cancel()"
    >
      Отменить
    </button>
  </div>
</div>
