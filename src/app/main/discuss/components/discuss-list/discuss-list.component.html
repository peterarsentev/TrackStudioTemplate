<div class="container py-3">
  <div class="row">
    <div class="col-12">
      <div class="card-glass rounded-4 shadow-sm overflow-hidden">

        <!-- List -->
        <div
          class="px-3 px-md-4 py-2"
          infinite-scroll
          [infiniteScrollDisabled]="!paginationAllowed"
          [infiniteScrollDistance]="scrollDistance"
          [infiniteScrollThrottle]="throttle"
          (scrolled)="onScrollDown()"
        >
          <table class="table table-borderless mb-0 align-middle bg-transparent">
            <tbody class="bg-transparent">

            <tr
              *ngFor="let discuss of discussList; let idx = index"
              class="border-bottom border-soft bg-transparent"
            >
              <!-- Content -->
              <td class="py-3 bg-transparent">

                <!--&lt;!&ndash; Breadcrumb (topic) &ndash;&gt;-->
                <!--<div *ngIf="discuss.topicName" class="mb-2">-->
                  <!--<div class="d-inline-flex align-items-center gap-2 px-3 py-2 rounded-4 card-glass">-->
                    <!--<a class="text-muted-soft text-decoration-none fw-semibold cursor-pointer" (click)="goToMain()">-->
                      <!--Job4j-->
                    <!--</a>-->
                    <!--<span class="text-muted-soft">/</span>-->
                    <!--<a class="text-muted-soft text-decoration-none fw-semibold cursor-pointer"-->
                       <!--(click)="goByNav(discuss)">-->
                      <!--{{ discuss.topicName }}-->
                    <!--</a>-->
                    <!--<span class="text-muted-soft">/</span>-->
                    <!--<span class=" fw-semibold">-->
                        <!--{{ discuss.name }}-->
                      <!--</span>-->
                  <!--</div>-->
                <!--</div>-->

                <!--&lt;!&ndash; Breadcrumb (exercise) &ndash;&gt;-->
                <!--<div *ngIf="discuss.exerciseId" class="mb-2">-->
                  <!--<div class="d-inline-flex align-items-center gap-2 px-3 py-2 rounded-4 card-glass">-->
                    <!--<a class="text-muted-soft text-decoration-none fw-semibold cursor-pointer" (click)="goToMain()">-->
                      <!--Job4j-->
                    <!--</a>-->
                    <!--<span class="text-muted-soft">/</span>-->
                    <!--<a class="text-muted-soft text-decoration-none fw-semibold cursor-pointer"-->
                       <!--(click)="goExercise()">-->
                      <!--Упражнения-->
                    <!--</a>-->
                  <!--</div>-->
                <!--</div>-->

                <!-- Title -->
                <div
                  class="d-flex align-items-start gap-2 cursor-pointer"
                  (click)="goTo(discuss)"
                >
                  <div class="min-w-0">
                    <div class="fw-semibold ">
                      {{ discuss.name }}
                    </div>

                    <div class="small text-muted-soft mt-1 d-flex flex-wrap gap-3">
                      <span>Автор: <span class="">{{ discuss.submitter.name }}</span></span>
                      <span>Создано: {{ discuss.created | date: 'dd.MM.yyyy HH:mm' }}</span>
                      <span>Обновлено: {{ discuss.updated | date: 'dd.MM.yyyy HH:mm' }}</span>
                    </div>
                  </div>
                </div>
              </td>

              <!-- Subscribe -->
              <td class="py-3 text-end bg-transparent" style="width: 48px;">
                <button
                  type="button"
                  class="btn btn-sm btn-link text-muted-soft p-0"
                  [title]="discuss.subscribed ? 'Отписаться' : 'Подписаться'"
                  (click)="subscribe(discuss, idx)"
                >
                  <i
                    class="bi"
                    [ngClass]="discuss.subscribed ? 'bi-bell-slash' : 'bi-bell'"
                  ></i>
                </button>
              </td>
            </tr>

            <tr *ngIf="!discussList?.length" class="bg-transparent">
              <td colspan="2" class="text-center text-muted-soft py-4 bg-transparent">
                Обсуждений пока нет
              </td>
            </tr>

            </tbody>
          </table>
        </div>
        <!-- /List -->

      </div>
    </div>
  </div>
</div>
