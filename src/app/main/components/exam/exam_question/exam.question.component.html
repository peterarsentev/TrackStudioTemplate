<div class="container py-4">
  <div class="card-glass rounded-4 shadow-sm overflow-hidden">

    <!-- Header -->
    <div class="px-3 px-md-4 py-3 border-bottom border-soft">
      <div class="fw-semibold text-white">
        {{ progress?.currentAnswers + 1 }} из {{ progress?.totalQuestions }} ·
        {{ navQuestion?.current?.name }}
      </div>
    </div>

    <!-- Content -->
    <div class="px-3 px-md-4 py-4">

      <div
        class="text-muted-soft mb-4"
        [innerHTML]="navQuestion?.current?.description | safeCode"
      ></div>

      <!-- Options -->
      <div class="d-flex flex-column gap-2 mb-4">
        <label
          class="card-glass rounded-3 p-3 d-flex align-items-start gap-3 cursor-pointer"
          *ngFor="let qp of qopts"
        >
          <input
            class="form-check-input mt-1"
            type="checkbox"
            [checked]="qp.checked"
            (change)="choose(navQuestion?.current?.id, qp, $event.target)"
            [value]="qp"
            [id]="qp.id"
          />
          <span
            class="text-muted-soft small"
            [innerHTML]="qp.description"
          ></span>
        </label>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-center gap-2 flex-wrap">
        <button
          class="btn btn-outline-light border-soft"
          *ngIf="navQuestion?.previous !== undefined"
          (click)="previous(navQuestion?.previous)"
        >
          Назад
        </button>

        <button
          class="btn btn-outline-light border-soft"
          *ngIf="navQuestion?.next !== undefined"
          (click)="next(navQuestion?.next)"
          [disabled]="aopts.length === 0"
        >
          Вперёд
        </button>

        <button
          class="btn btn-j-primary"
          *ngIf="navQuestion?.next === undefined"
          (click)="calcResult()"
          [disabled]="aopts.length === 0"
        >
          Показать результат
        </button>
      </div>

    </div>
  </div>
</div>
