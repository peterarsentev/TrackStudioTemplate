<div class="container py-4">
  <div class="card-glass rounded-4 shadow-sm overflow-hidden mb-3">

    <!-- Header -->
    <div class="px-3 px-md-4 py-3 border-bottom border-soft">
      <div class="fw-semibold text-white mb-1">
        {{ exam.name }}
      </div>
      <div class="text-muted-soft small">
        {{ exam.intro }}
      </div>
    </div>

    <!-- Content -->
    <div class="px-3 px-md-4 py-4">
      <div
        class="text-muted-soft exam-description"
        [innerHTML]="exam?.description | safeCode"
      ></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="d-flex flex-wrap gap-2 mb-4">
    <button
      class="btn btn-j-primary"
      (click)="startExam(exam)"
    >
      Начать экзамен
    </button>
  </div>
</div>

<app-leaders></app-leaders>
