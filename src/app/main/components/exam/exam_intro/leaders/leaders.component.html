<div class="container py-4">
  <div class="card-glass rounded-4 shadow-sm overflow-hidden">

    <!-- Header -->
    <div class="px-3 px-md-4 py-3 border-bottom border-soft">
      <div class="fw-semibold text-white">
        Лидеры
      </div>
      <div class="text-muted-soft small mt-1">
        Лучшие результаты по итогам экзаменов
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="table table-borderless mb-0 align-middle bg-transparent">
        <tbody class="bg-transparent text-muted-soft">
        <tr
          *ngFor="let leader of leaders"
          class="border-bottom border-soft bg-transparent"
        >
          <td
            class="py-3 bg-transparent text-white fw-semibold cursor-pointer"
            (click)="openProfile(leader.userId, leader.login)"
          >
            <i class="fa fa-user me-2 opacity-75"></i>
            {{ leader.username }}
          </td>

          <td class="py-3 bg-transparent small">
            {{ leader.finish | date:'dd.MM.yyyy HH:mm' }}
          </td>

          <td class="py-3 bg-transparent text-end fw-semibold text-white">
            {{ leader.score }}%
          </td>
        </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
