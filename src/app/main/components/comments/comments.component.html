<div class="container pb-4">
  <div class="row pt-3" id="com">
    <div class="col-12">
      <div class="card-glass rounded-4 shadow-sm overflow-hidden">
        <div class="px-3 px-md-4 py-3 border-bottom border-soft">
          <div class="fw-semibold  d-flex align-items-center gap-2">
            <i class="bi bi-chat-square-text"></i>
            Комментарий
          </div>
          <div class="text-muted-soft small mt-1">
            Выполняется: <span class="">{{ operation }}</span>
          </div>
        </div>

        <div class="px-3 px-md-4 py-3">
          <form [formGroup]="form">
            <!-- Handlers -->
            <div class="mb-3">
              <app-hendlers
                [handlers]="handlers"
                [searchHandlers]="handlers"
                (selected)="selectPerson($event)"
              ></app-hendlers>

              <div *ngFor="let error of validationErrors.handlerId" class="mt-2">
                <small
                  *ngIf="
                    form.get('handlerId').hasError(error.type) &&
                    (form.get('handlerId').dirty || form.get('handlerId').touched)
                  "
                  class="text-danger"
                >
                  {{ error.message }}
                </small>
              </div>
            </div>

            <!-- Editor -->
            <div class="mb-3">
              <app-redactor
                [titleLabel]="'Выполняется: ' + operation"
                (outputEmitter)="setDescription($event)"
              ></app-redactor>
            </div>

            <!-- Actions -->
            <div class="d-flex flex-wrap gap-2 justify-content-between">
              <div class="d-flex flex-wrap gap-2">
                <button
                  type="button"
                  class="btn btn-j-primary"
                  [disabled]="form.invalid || disabled"
                  (click)="form.valid && submitComment({ save: true })"
                >
                  <span
                    *ngIf="disabled"
                    class="spinner-border spinner-border-sm me-2"
                    role="status"
                    aria-hidden="true"
                  ></span>
                  Сохранить
                </button>

                <button
                  type="button"
                  class="btn btn-outline-light border-soft"
                  [disabled]="form.invalid || disabled"
                  (click)="form.valid && submitComment({ saveAndUp: true })"
                >
                  <span
                    *ngIf="disabled"
                    class="spinner-border spinner-border-sm me-2"
                    role="status"
                    aria-hidden="true"
                  ></span>
                  Сохранить и наверх
                </button>

                <button
                  type="button"
                  class="btn btn-outline-light border-soft"
                  [disabled]="form.invalid || disabled"
                  (click)="form.valid && submitComment({ saveAndNext: true })"
                >
                  <span
                    *ngIf="disabled"
                    class="spinner-border spinner-border-sm me-2"
                    role="status"
                    aria-hidden="true"
                  ></span>
                  Сохранить и далее
                </button>
              </div>

              <button
                type="button"
                class="btn btn-outline-light border-soft"
                [disabled]="disabled"
                (click)="closeForm()"
              >
                <span
                  *ngIf="disabled"
                  class="spinner-border spinner-border-sm me-2"
                  role="status"
                  aria-hidden="true"
                ></span>
                Отмена
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
