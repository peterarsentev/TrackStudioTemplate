<div class="container py-4" *ngIf="solutions.length > 1">
  <nav aria-label="breadcrumb">
    <ol class="crumbs card-glass rounded-4 shadow-sm px-3 px-md-4 py-2 d-flex align-items-center">
      <ng-container *ngFor="let nav of solutions; let idx = index; let last = last">
        <li class="d-inline-flex align-items-center">
          <ng-container *ngIf="!last; else lastTpl">
            <a
              class="text-muted-soft fw-semibold cursor-pointer"
              (click)="goToSol(nav, idx)"
            >
              {{ nav.name }}
            </a>
          </ng-container>

          <ng-template #lastTpl>
            <span class="fw-semibold current">
              {{ nav.name }}
            </span>
          </ng-template>
        </li>

        <li *ngIf="!last" class="sep d-inline-flex align-items-center px-2">→</li>
      </ng-container>
    </ol>
  </nav>
</div>
