<div class="progress progress-glass">
  <div
    class="progress-bar progress-bar-gradient"
    role="progressbar"
    [ngStyle]="{ width: barValue + '%' }"
    aria-valuemin="0"
    aria-valuemax="100"
  >
    {{ barValue }}%
  </div>
</div>

<div class="mt-1">
  <small class="text-muted">
    Выполнено {{ solvedTasksCount }} из {{ allTasksCount }}
  </small>
</div>
