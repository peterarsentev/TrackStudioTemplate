<div class="row pt-5 justify-content-center">
  <div class="col-sm-10 col-md-7 col-lg-5">
    <div class="card-glass rounded-5 shadow-soft p-4 p-md-5">
      <!-- Header -->
      <div class="text-center mb-4">
        <h4 class="fw-bold mb-1">Вход в Job4j</h4>
        <p class="text-muted-soft mb-0">
          {{ error ? 'Проверьте данные для входа' : 'Авторизуйтесь, чтобы продолжить' }}
        </p>
      </div>

      <!-- Error -->
      <div
        class="alert alert-danger text-center py-2"
        role="alert"
        *ngIf="error"
      >
        Неверный логин или пароль
      </div>

      <!-- Form -->
      <form [formGroup]="form" class="mt-3">
        <!-- Login -->
        <div class="mb-3">
          <label for="email" class="form-label text-muted-soft">
            Логин
          </label>
          <input
            id="email"
            type="text"
            formControlName="login"
            class="form-control bg-transparent  border-soft"
            placeholder="Введите логин"
            (ngModelChange)="resetError()"
          />
          <div *ngFor="let error of validationErrors.login">
            <small
              *ngIf="
                form.get('login').hasError(error.type) &&
                (form.get('login').dirty || form.get('login').touched)
              "
              class="text-danger"
            >
              {{ error.message }}
            </small>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label for="pwd" class="form-label text-muted-soft">
            Пароль
          </label>
          <input
            id="pwd"
            type="password"
            formControlName="password"
            class="form-control bg-transparent  border-soft"
            placeholder="Введите пароль"
            (keydown.enter)="sendForm()"
            (ngModelChange)="resetError()"
          />
          <div *ngFor="let error of validationErrors.password">
            <small
              *ngIf="
                form.get('password').hasError(error.type) &&
                (form.get('password').dirty || form.get('password').touched)
              "
              class="text-danger"
            >
              {{ error.message }}
            </small>
          </div>
        </div>
      </form>

      <!-- Actions -->
      <div class="d-grid gap-2 mb-3">
        <button
          type="button"
          class="btn btn-success"
          (click)="login()"
          [disabled]="form.invalid || submit"
        >
          <i class="bi bi-box-arrow-in-right me-1"></i>
          Войти
        </button>
      </div>
    </div>
  </div>
</div>
