<ng-container>
  <div class="container py-4">

    <div class="card-glass rounded-4 shadow-sm overflow-hidden">

      <!-- Header -->
      <div class="px-3 px-md-4 py-3 border-bottom border-soft">
        <div class="fw-semibold  mb-2">
          {{ project.name }}
        </div>

        <div class="d-flex flex-wrap gap-2">
          <span *ngIf="project.status == 0" class="badge badge-info">
            Ожидает сборки
          </span>
          <span *ngIf="project.status == 1" class="badge badge-warning">
            Идет сборка
          </span>
          <span *ngIf="project.status == 2" class="badge badge-success">
            Проект собран
          </span>
          <span *ngIf="project.status == 3" class="badge badge-danger">
            Проект содержит ошибки
          </span>
        </div>
      </div>

      <!-- Log -->
      <div class="px-3 px-md-4 py-4">
        <ngx-codemirror
          [(ngModel)]="project.log"
          [options]="options"
        ></ngx-codemirror>
      </div>

    </div>

  </div>
</ng-container>
