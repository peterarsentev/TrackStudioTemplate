<div class="container py-4">

  <div class="card-glass rounded-4 shadow-sm overflow-hidden">

    <!-- Header -->
    <div class="px-3 px-md-4 py-3 border-bottom border-soft">
      <div class="fw-semibold text-white mb-1">
        Структура курса
      </div>
      <div class="text-muted-soft small">
        Описание блоков, стоимость прохождения и история обновлений
      </div>
    </div>

    <!-- Content (no table) -->
    <div class="px-3 px-md-4 py-4 d-flex flex-column gap-3">

      <div
        *ngFor="let category of categories"
        class="card-glass rounded-3 p-4"
      >

        <!-- Title -->
        <div class="fw-semibold text-white mb-2">
          {{ levelById.get(category.levelId).name }} ·
          <span *ngIf="category.upgradedId === 0">
            {{ category.name }}
          </span>

          <span *ngIf="category.upgradedId !== 0">
            <span style="text-decoration: line-through; opacity:.7">
              {{ category.name }}
            </span>
            <span class="text-muted-soft mx-1">→</span>
            {{ categoryById.get(category.upgradedId).name }}
          </span>
        </div>

        <!-- Description -->
        <div
          class="text-muted-soft small"
          [innerHTML]="category?.description | safeCode"
        ></div>

      </div>

      <!-- Empty -->
      <div
        *ngIf="!categories?.length"
        class="text-center text-muted-soft py-4"
      >
        Разделы курса пока отсутствуют
      </div>

    </div>

  </div>

</div>
