<div class="container py-3">
  <div class="row">
    <div class="col-12">

      <!-- TASK / DESCRIPTION -->
      <div class="card-glass rounded-4 shadow-sm overflow-hidden mb-3">
        <div class="px-3 px-md-4 py-3 border-bottom border-soft">
          <div class="d-flex flex-wrap align-items-start justify-content-between gap-2">
            <div class="fw-semibold text-white">
              {{ name }}
            </div>

            <div class="small text-muted-soft" *ngIf="userModels">
              <span class="d-inline-flex align-items-center gap-1">
                <i class="bi bi-person"></i>
                Автор: <span class="text-white fw-semibold">{{ userModels.name }}</span>
              </span>
              <span class="mx-2 text-muted-soft">•</span>
              <span class="d-inline-flex align-items-center gap-1">
                <i class="bi bi-clock"></i>
                Решено: {{ created | date:'dd.MM.yyyy HH:mm' }}
              </span>
            </div>
          </div>
        </div>

        <div class="px-3 px-md-4 py-3">
          <div class="text-muted-soft" [innerHTML]="description"></div>

          <div class="mt-3" *ngIf="code">
            <div class="small text-muted-soft mb-2 d-flex align-items-center gap-2">
              <i class="bi bi-code-slash"></i>
              Код
            </div>
            <ngx-codemirror [(ngModel)]="code" [options]="options"></ngx-codemirror>
          </div>
        </div>
      </div>

      <!-- SOLUTION -->
      <div class="card-glass rounded-4 shadow-sm overflow-hidden mb-3">
        <div class="px-3 px-md-4 py-3 border-bottom border-soft">
          <div class="fw-semibold text-white d-flex align-items-center gap-2">
            <i class="bi bi-check2-circle"></i>
            Решение
          </div>
        </div>

        <div class="px-3 px-md-4 py-3">
          <div class="text-muted-soft" *ngIf="text" [innerHTML]="text"></div>

          <div class="mt-3" *ngIf="code">
            <div class="small text-muted-soft mb-2 d-flex align-items-center gap-2">
              <i class="bi bi-braces"></i>
              Код решения
            </div>
            <ngx-codemirror [(ngModel)]="code" [options]="options"></ngx-codemirror>
          </div>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="d-flex justify-content-end">
        <button
          type="button"
          class="btn btn-sm btn-j-primary d-inline-flex align-items-center gap-2"
          (click)="publishSolution()"
        >
          <i class="bi bi-upload"></i>
          Опубликовать решение
        </button>
      </div>

    </div>
  </div>
</div>
