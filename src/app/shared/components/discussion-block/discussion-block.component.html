<div class="row mt-2" style="word-break: break-all;">
  <div class="col-12">
    <div class="card-glass rounded-4 shadow-sm overflow-hidden">
      <!-- Header -->
      <div class="px-3 px-md-4 py-3 border-bottom border-soft">
        <div class="d-flex flex-wrap gap-2 align-items-start justify-content-between">
          <div class="min-w-0">
            <div class="fw-semibold  d-flex align-items-center gap-2">
              <i class="bi bi-chat-dots"></i>
              Обсуждения
            </div>

            <div class="mt-1">
              <small *ngIf="title" class="text-muted-soft">
                {{ title }}
              </small>

              <small *ngIf="!title" class="text-muted-soft">
                {{
                company
                ? 'Эти комментарии доступны всем. Поделитесь своим мнением о компании'
                : 'Эти комментарии доступны всем ученикам. Поделитесь своим мнением о задаче, полезными ссылками, рекомендациями по решению. Не скидывайте решения целиком!'
                }}
              </small>
            </div>
          </div>

          <div *ngIf="inTask" class="d-flex flex-wrap gap-2">
            <button
              type="button"
              class="btn btn-sm btn-outline-light border-soft d-inline-flex align-items-center gap-1"
              (click)="show()"
            >
              <i class="bi bi-download"></i>
              Загрузить: {{ discussions.length }}
            </button>

            <button
              type="button"
              class="btn btn-sm btn-outline-light border-soft d-inline-flex align-items-center gap-1"
              *ngIf="!!user && user?.login !== 'guest'"
              (click)="showDiscussionForm()"
            >
              <i class="bi bi-chat-right-text"></i>
              Обсудить
            </button>
          </div>
        </div>
      </div>

      <!-- Body -->
      <div *ngIf="needToShow" class="px-3 px-md-4 py-3 bg-transparent">
        <table class="table table-borderless mb-0 align-middle bg-transparent" *ngIf="discussions">
          <tbody class="bg-transparent">
          <tr
            app-discussion-element
            class="border-bottom border-soft bg-transparent"
            *ngFor="let discussion of discussions"
            (click)="goTo(discussion)"
            [user]="user"
            [canResponse]="canResponse"
            [discussion]="discussion"
            (response)="addNewResponse($event)"
            (deleteEmitter)="deleteDiscussion($event)"
            (updateEmitter)="update($event)"
            style="background: transparent !important;"
          ></tr>

          <tr *ngIf="!discussions?.length" class="bg-transparent" style="background: transparent !important;">
            <td class="text-center text-muted-soft py-4 bg-transparent" style="background: transparent !important;">
              Пока нет обсуждений
            </td>
          </tr>
          </tbody>
        </table>

        <div class="row mt-3 bg-transparent" *ngIf="showDiscussion">
          <app-discussion (closeEmitter)="closeDiscussionForm($event)"></app-discussion>
        </div>
      </div>
    </div>
  </div>
</div>
