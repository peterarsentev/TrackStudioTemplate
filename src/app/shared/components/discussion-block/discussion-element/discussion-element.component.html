<td id="comment_{{discussion.id}}">
  <div *ngIf="!showDiscussion">
    <div class="pb-3 small" style="display: flex;justify-content: space-between;align-items: center;">
      <div>
        <span>
          <span (click)="goToProfile(discussion.userId)" class="font-weight-bold d-block" style="cursor: pointer;">
            <i class="fa fa-user mr-1"></i>{{ discussion.name }}
          </span>
        </span>
        <small *ngIf="discussion.userCreated"
               class="mb-2 text-muted d-block">{{ ' Дата регистрации:' }} {{ discussion.userCreated | date: 'dd.MM.yyyy' }}</small>
      </div>
      <div style="display: flex;flex-direction: column;">
        <div style="display: flex">
          <span class="pull-right">{{ discussion.time | date: 'dd.MM.yyyy HH:mm' }}</span>
          <span class="pull-right" *ngIf="discussion.userId === user.id" (click)="openConfirmModal()">
            <i class="fa fa-remove ml-3"></i>
           </span>
          <span class="pull-right" *ngIf="discussion.userId === user.id" (click)="change()">
             <i class="fa fa-edit ml-3"></i>
          </span>
        </div>
        <app-rating [user]="user"
                    [discussion]="discussion"></app-rating>
      </div>
    </div>

    <div class="custom-card card-body">
      <p class="card-text" [innerHTML]="discussion.text | safeCode"></p>
    </div>
    <div *ngIf="!!discussion?.responses?.length">
      <div class="card mt-1 mb-1">
        <div class="card-header">
          <div class="font-weight-bold">Ответы:</div>
        </div>
        <div class="card-body">
          <ng-container *ngFor="let d of discussion.responses">
            <div *ngIf="!d.editResponse">
              <div class="pb-3" style="display: flex;justify-content: space-between;align-items: center;">
                <div style="display: flex;flex-direction: column">
                  <span class="small d-block">Oт
                    <span class="font-weight-bold">{{ d.name }}</span>
                  </span>
                  <small *ngIf="d.userCreated"
                       class="mb-2 text-muted d-block">{{ ' Дата регистрации:' }} {{ d.userCreated | date: 'dd.MM.yyyy' }}</small>
                </div>
                <div style="display: flex;flex-direction: column;">
                  <div style="display: flex">
                    <span class="pull-right">{{ d.time | date: 'dd.MM.yyyy HH:mm' }}</span>
                    <span class="pull-right" *ngIf="d.userId === user.id" (click)="openConfirmModal(d)">
                      <i class="fa fa-remove ml-3"></i>
                     </span>
                    <span class="pull-right" *ngIf="d.userId === user.id" (click)="changeResponse(d)">
                       <i class="fa fa-edit ml-3"></i>
                    </span>
                  </div>
                  <app-rating [user]="user"
                              [discussion]="d"></app-rating>
                </div>
              </div >
              <div class="custom-card card-body">
                <p class="card-text" [innerHTML]="d.text | safeCode"></p>
              </div>
              <!--              <div class="border-bottom" [innerHTML]="d.text | safeCode"></div>-->
            </div>
            <div class="row" *ngIf="d.editResponse">
              <app-discussion
                [title]="'Выполняется: Редактирование комментария'"
                [text]="d.text"
                (closeEmitter)="update($event, d)"
              ></app-discussion>
            </div>
          </ng-container>
        </div>
      </div>
    </div>

    <div *ngIf="!discussion.parentId || discussion.parentId === -1">
      <button type="button" (click)="showAddResponseForm()"
              class="pull-left btn btn-light btn-sm">
        <i class="fa fa-reply mr-1"></i>
        Ответить
      </button>
    </div>
  </div>
  <div class="row" *ngIf="showDiscussion">
    <app-discussion
      [title]="'Выполняется: Редактирование комментария'"
      [text]="discussion.text"
      (closeEmitter)="update($event)"
    ></app-discussion>
  </div>
  <div class="row" *ngIf="addResponse">
    <app-discussion
      [title]="'Выполняется: Ответ на комментарий'"
      [text]=""
      (closeEmitter)="addNewResponse($event)"
    ></app-discussion>
  </div>
</td>
