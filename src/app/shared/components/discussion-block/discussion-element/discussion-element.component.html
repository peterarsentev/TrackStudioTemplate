<td id="comment_{{discussion.id}}" class="bg-transparent">
  <div *ngIf="!showDiscussion" class="bg-transparent">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-start gap-3 mb-2 bg-transparent">
      <div class="min-w-0 bg-transparent">
        <div
          (click)="goToProfile(discussion.userId)"
          class="fw-semibold text-white cursor-pointer d-inline-flex align-items-center gap-2"
        >
          <i class="bi bi-person"></i>
          <span class="text-truncate">{{ discussion.name }}</span>
        </div>

        <div *ngIf="discussion.userCreated" class="text-muted-soft small mt-1">
          Дата регистрации: {{ discussion.userCreated | date: 'dd.MM.yyyy' }}
        </div>
      </div>

      <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end bg-transparent">
        <span class="text-muted-soft small">
          {{ discussion.time | date: 'dd.MM.yyyy HH:mm' }}
        </span>

        <button
          *ngIf="discussion.userId === user.id"
          type="button"
          class="btn btn-sm btn-link text-muted-soft p-0 bg-transparent"
          (click)="openConfirmModal()"
          title="Удалить"
        >
          <i class="bi bi-x-lg"></i>
        </button>

        <button
          *ngIf="discussion.userId === user.id"
          type="button"
          class="btn btn-sm btn-link text-muted-soft p-0 bg-transparent"
          (click)="change()"
          title="Редактировать"
        >
          <i class="bi bi-pencil"></i>
        </button>

        <app-rating [user]="user" [discussion]="discussion"></app-rating>
      </div>
    </div>

    <!-- Text -->
    <div class="mb-2 bg-transparent">
      <div class="text-muted-soft bg-transparent" [innerHTML]="discussion.text | safeCode"></div>
    </div>

    <!-- Responses -->
    <div *ngIf="!!discussion?.responses?.length" class="mt-2 bg-transparent">
      <div class="card-glass rounded-4 shadow-sm overflow-hidden bg-transparent">
        <div class="px-3 py-2 border-bottom border-soft bg-transparent">
          <div class="fw-semibold text-white">Ответы</div>
        </div>

        <div class="px-3 py-3 bg-transparent">
          <ng-container *ngFor="let d of discussion.responses">
            <div class="pb-3 border-bottom border-soft mb-3 bg-transparent" *ngIf="!d.editResponse">
              <div class="d-flex justify-content-between align-items-start gap-3 mb-2 bg-transparent">
                <div class="min-w-0 bg-transparent">
                  <div class="small text-muted-soft">
                    От <span class="fw-semibold text-white">{{ d.name }}</span>
                  </div>

                  <div *ngIf="d.userCreated" class="text-muted-soft small mt-1">
                    Дата регистрации: {{ d.userCreated | date: 'dd.MM.yyyy' }}
                  </div>
                </div>

                <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end bg-transparent">
                  <span class="text-muted-soft small">
                    {{ d.time | date: 'dd.MM.yyyy HH:mm' }}
                  </span>

                  <button
                    *ngIf="d.userId === user.id"
                    type="button"
                    class="btn btn-sm btn-link text-muted-soft p-0 bg-transparent"
                    (click)="openConfirmModal(d)"
                    title="Удалить"
                  >
                    <i class="bi bi-x-lg"></i>
                  </button>

                  <button
                    *ngIf="d.userId === user.id"
                    type="button"
                    class="btn btn-sm btn-link text-muted-soft p-0 bg-transparent"
                    (click)="changeResponse(d)"
                    title="Редактировать"
                  >
                    <i class="bi bi-pencil"></i>
                  </button>

                  <app-rating [user]="user" [discussion]="d"></app-rating>
                </div>
              </div>

              <div class="text-muted-soft bg-transparent" [innerHTML]="d.text | safeCode"></div>
            </div>

            <div class="row bg-transparent" *ngIf="d.editResponse">
              <app-discussion
                [title]="'Выполняется: Редактирование комментария'"
                [text]="d.text"
                (closeEmitter)="update($event, d)"
              ></app-discussion>
            </div>
          </ng-container>
        </div>
      </div>
    </div>

    <!-- Reply button -->
    <div *ngIf="!discussion.parentId || discussion.parentId === -1" class="mt-2 bg-transparent">
      <button
        type="button"
        class="btn btn-sm btn-outline-light border-soft d-inline-flex align-items-center gap-1"
        (click)="showAddResponseForm()"
      >
        <i class="bi bi-reply"></i>
        Ответить
      </button>
    </div>
  </div>

  <!-- Edit discussion -->
  <div class="row bg-transparent" *ngIf="showDiscussion">
    <app-discussion
      [title]="'Выполняется: Редактирование комментария'"
      [text]="discussion.text"
      (closeEmitter)="update($event)"
    ></app-discussion>
  </div>

  <!-- Add response -->
  <div class="row bg-transparent" *ngIf="addResponse">
    <app-discussion
      [title]="'Выполняется: Ответ на комментарий'"
      [text]=""
      (closeEmitter)="addNewResponse($event)"
    ></app-discussion>
  </div>
</td>
