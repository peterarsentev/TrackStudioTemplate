<div class="card-glass rounded-4 shadow-sm overflow-hidden">
  <div class="px-3 px-md-4 py-3 border-bottom border-soft">
    <div class="fw-semibold  d-flex align-items-center gap-2">
      <i class="bi bi-person"></i>
      Ответственный ментор:
      <span class="text-muted-soft">{{ userName }}</span>
    </div>
  </div>

  <div class="px-3 px-md-4 py-3">
    <div
      class="form-check mb-2"
      *ngFor="let handler of searchHandlers; let idx = index"
    >
      <input
        class="form-check-input"
        type="radio"
        name="groupOfDefaultRadios"
        id="handler_{{ idx }}"
        [checked]="handler.name === 'Петр Арсентьев'"
        (change)="select(handler)"
      />

      <label
        class="form-check-label d-flex align-items-center gap-2 text-muted-soft cursor-pointer"
        for="handler_{{ idx }}"
      >
        <i class="bi bi-person"></i>
        <span class="">{{ handler.name }}</span>
      </label>
    </div>
  </div>
</div>
