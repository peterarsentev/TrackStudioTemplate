<div class="container py-4">

  <div class="card-glass rounded-4 shadow-sm overflow-hidden">

    <!-- Header -->
    <div class="px-3 px-md-4 py-3 border-bottom border-soft">
      <div class="fw-semibold text-white">
        Изменение пароля
      </div>
      <div class="text-muted-soft small">
        Задайте новый пароль для входа в систему
      </div>
    </div>

    <!-- Alert -->
    <div
      *ngIf="alert"
      class="mx-3 mx-md-4 mt-3 card-glass rounded-3 p-3 text-center text-success"
    >
      Пароль успешно обновлён
    </div>

    <!-- Form -->
    <form [formGroup]="form" class="px-3 px-md-4 py-4 d-flex flex-column gap-3">

      <div class="row align-items-center">
        <label
          for="newPassword"
          class="col-sm-4 col-form-label text-muted-soft"
        >
          Новый пароль
        </label>
        <div class="col-sm-8">
          <input
            type="password"
            id="newPassword"
            formControlName="password"
            class="form-control bg-transparent text-white border-soft"
            placeholder="Введите новый пароль"
          >
        </div>
      </div>

      <div class="row align-items-center">
        <label
          for="repeatPassword"
          class="col-sm-4 col-form-label text-muted-soft"
        >
          Повторите пароль
        </label>
        <div class="col-sm-8">
          <input
            type="password"
            id="repeatPassword"
            formControlName="confirm"
            class="form-control bg-transparent text-white border-soft"
            placeholder="Повторите пароль"
          >

          <div
            class="text-danger small mt-1"
            *ngIf="form.get('confirm')?.touched && form.controls.confirm.errors?.mustMatch"
          >
            Пароли должны совпадать
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-end mt-3">
        <button
          type="button"
          class="btn btn-j-primary"
          [disabled]="form.invalid"
          (click)="submit()"
        >
          Обновить пароль
        </button>
      </div>

    </form>
  </div>

</div>
