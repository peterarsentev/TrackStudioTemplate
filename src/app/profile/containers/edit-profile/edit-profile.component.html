<div class="container py-4">

  <div class="card-glass rounded-4 shadow-sm overflow-hidden">

    <!-- Header -->
    <div class="px-3 px-md-4 py-3 border-bottom border-soft">
      <div class="fw-semibold ">
        Редактирование профиля
      </div>
      <div class="text-muted-soft small">
        Обновите персональные данные
      </div>
    </div>

    <!-- Form -->
    <form [formGroup]="form" class="px-3 px-md-4 py-4 d-flex flex-column gap-3">

      <div class="row align-items-center">
        <label for="name" class="col-sm-4 col-form-label text-muted-soft">
          Имя
        </label>
        <div class="col-sm-8">
          <input
            type="text"
            id="name"
            formControlName="name"
            class="form-control bg-transparent  border-soft"
            placeholder="Имя"
          >
        </div>
      </div>

      <div class="row align-items-center">
        <label for="email" class="col-sm-4 col-form-label text-muted-soft">
          Почта
        </label>
        <div class="col-sm-8">
          <input
            type="text"
            id="email"
            formControlName="email"
            class="form-control bg-transparent  border-soft"
            placeholder="Почта"
          >
        </div>
      </div>

      <div class="row align-items-center">
        <label for="startedAt" class="col-sm-4 col-form-label text-muted-soft">
          Дата начала обучения
        </label>
        <div class="col-sm-8">
          <input
            type="date"
            id="startedAt"
            formControlName="startedAt"
            class="form-control bg-transparent  border-soft"
          >
        </div>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-end mt-3">
        <button
          type="button"
          class="btn btn-j-primary"
          [disabled]="form.invalid"
          (click)="submitForm()"
        >
          Сохранить изменения
        </button>
      </div>

    </form>
  </div>

</div>
