<div class="container py-4">

  <!-- Actions -->
  <div
    class="d-flex justify-content-end gap-2 mb-3"
    *ngIf="canUpdateYourSelf"
  >
    <button
      type="button"
      class="btn  border-soft btn-sm"
      (click)="goToEditProfile()"
    >
      Редактировать
    </button>

    <button
      type="button"
      class="btn  border-soft btn-sm"
      (click)="goToChangePassword()"
    >
      Изменить пароль
    </button>
  </div>

  <!-- Profile card -->
  <div class="card-glass rounded-4 shadow-sm overflow-hidden">

    <div class="px-3 px-md-4 py-3 border-bottom border-soft">
      <div class="fw-semibold ">
        Профиль пользователя
      </div>
    </div>

    <div class="px-3 px-md-4 py-4 d-flex flex-column gap-3">

      <div class="d-flex justify-content-between">
        <span class="text-muted-soft">Имя</span>
        <span class=" fw-semibold">{{ user?.name }}</span>
      </div>

      <div class="d-flex justify-content-between">
        <span class="text-muted-soft">Логин</span>
        <span class=" fw-semibold">{{ user?.login }}</span>
      </div>

      <div class="d-flex justify-content-between">
        <span class="text-muted-soft">Почта</span>
        <span class=" fw-semibold">{{ user?.email }}</span>
      </div>

      <div
        class="d-flex justify-content-between align-items-center"
        *ngIf="canUpdateYourSelf"
      >
        <span class="text-muted-soft">Уведомления</span>

        <label class="switch">
          <input
            type="checkbox"
            [checked]="showNotification"
            (change)="sendNotification()"
          >
          <span class="slider round"></span>
        </label>
      </div>

      <div class="d-flex justify-content-between">
        <span class="text-muted-soft">Номер договора</span>
        <span class=" fw-semibold">{{ user?.id }}</span>
      </div>

      <div class="d-flex justify-content-between">
        <span class="text-muted-soft">Начало обучения</span>
        <span class=" fw-semibold">
          <ng-container *ngIf="!user?.startedAt">
            Вычисляется от первого комментария
          </ng-container>
          <ng-container *ngIf="user?.startedAt">
            {{ user?.startedAt | date:'dd.MM.yyyy HH:mm' }}
          </ng-container>
        </span>
      </div>

    </div>
  </div>

</div>
