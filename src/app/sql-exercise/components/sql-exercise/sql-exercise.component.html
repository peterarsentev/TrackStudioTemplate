<div class="container py-3">
  <div class="row">
    <div class="col-12">

      <!-- TOP ACTIONS -->
      <div class="d-flex justify-content-end gap-2 mb-3">
        <button
          *ngIf="prevId !== null"
          type="button"
          class="btn btn-sm btn-outline-light border-soft"
          (click)="goTo(prevId)"
        >
          <i class="bi bi-chevron-left me-1"></i>Предыдущая
        </button>

        <button
          *ngIf="nextId !== null"
          type="button"
          class="btn btn-sm btn-outline-light border-soft"
          (click)="goTo(nextId)"
        >
          Следующая<i class="bi bi-chevron-right ms-1"></i>
        </button>

        <button
          class="btn btn-sm btn-outline-info border-soft"
          [disabled]="exercise.status !== 'COMPLETE'"
          title="Решения других учеников станут доступны после выполнения упражнения"
        >
          Было решено: {{ solvedSize.size }}
        </button>
      </div>

      <!-- EXERCISE CARD -->
      <div class="card-glass rounded-4 shadow-sm overflow-hidden mb-3">
        <div class="px-3 px-md-4 py-3 border-bottom border-soft">
          <div class="fw-semibold ">
            {{ exercise.title }}
          </div>

          <div class="mt-1">
            <span
              *ngIf="exercise.status === 'COMPLETE'"
              class="badge badge-good rounded-pill me-2"
            >Выполнено</span>
            <span
              *ngIf="exercise.status === 'NEW'"
              class="badge badge-accent rounded-pill me-2"
            >Новая</span>
            <span
              *ngIf="exercise.status === 'PROGRESS'"
              class="badge badge-warn rounded-pill me-2"
            >В процессе</span>
          </div>
        </div>

        <div class="px-3 px-md-4 py-3">
          <div class="text-muted-soft mb-3" [innerHTML]="exercise.description"></div>

          <div class="fw-semibold  mb-1">Схема базы данных</div>
          <ngx-codemirror
            *ngIf="load"
            [(ngModel)]="exercise.scheme"
            [options]="optionsOutput"
          ></ngx-codemirror>

          <div class="fw-semibold  mt-3 mb-1">Данные</div>
          <ngx-codemirror
            *ngIf="load"
            [(ngModel)]="exercise.initScript"
            [options]="optionsOutput"
          ></ngx-codemirror>

          <div class="fw-semibold  mt-3 mb-1">Запрос</div>
          <ngx-codemirror
            *ngIf="load"
            [(ngModel)]="solutionSql"
            [options]="solutionOptions"
          ></ngx-codemirror>

          <div class="fw-semibold  mt-3 mb-1">Результат</div>

          <div
            *ngIf="solutionResult.message && solutionResult.equal"
            class="alert alert-success"
          >
            Поздравляем! Задача решена верно.
          </div>

          <div
            *ngIf="solutionResult.message && !solutionResult.equal"
            class="alert alert-danger"
          >
            Решение неверное.
          </div>

          <ngx-codemirror
            *ngIf="load"
            [(ngModel)]="solutionResult.message"
            [options]="optionsOutput"
          ></ngx-codemirror>

          <!-- ACTION BUTTONS -->
          <div class="d-flex flex-wrap gap-2 mt-3">
            <button
              *ngIf="load"
              class="btn btn-sm btn-j-primary"
              (click)="sendSolution()"
              [disabled]="solutionSql.length === 0 || !checked"
            >
              <i class="bi bi-play-fill me-1"></i>
              {{ exercise.status === 'NEW' ? 'Решить' : 'Проверить' }}
            </button>

            <button
              *ngIf="load && exercise.status !== 'NEW'"
              class="btn btn-sm btn-outline-light border-soft"
              (click)="wipeSolution()"
              [disabled]="solutionSql.length === 0 || !checked"
            >
              <i class="bi bi-arrow-repeat me-1"></i>
              Сбросить решение
            </button>
          </div>
        </div>
      </div>

      <!-- BOTTOM NAV -->
      <div class="d-flex justify-content-end gap-2 mb-3">
        <button
          *ngIf="prevId !== null"
          class="btn btn-sm btn-outline-light border-soft"
          (click)="goTo(prevId)"
        >
          <i class="bi bi-chevron-left me-1"></i>Предыдущая
        </button>

        <button
          *ngIf="nextId !== null"
          class="btn btn-sm btn-outline-light border-soft"
          (click)="goTo(nextId)"
        >
          Следующая<i class="bi bi-chevron-right ms-1"></i>
        </button>
      </div>

      <!-- DISCUSSIONS -->
      <div class="card-glass rounded-4 shadow-sm overflow-hidden mb-3">
        <app-discussion-block
          [discussions]="discussions"
          [user]="user"
          (addResponse)="addResponse($event)"
          (updateEmitter)="updateDiscussion($event)"
          (closeEmitter)="closeDiscussion($event)"
          (showButton)="showButton()"
        ></app-discussion-block>
      </div>

      <!-- DISCUSS BUTTON -->
      <div
        *ngIf="showButtonBottom && canCreateDiscuss"
        class="d-flex justify-content-end"
      >
        <button
          class="btn btn-sm btn-outline-info border-soft"
          (click)="showDiscussionForm()"
        >
          <i class="bi bi-chat-dots me-1"></i>
          Обсудить
        </button>
      </div>

    </div>
  </div>
</div>
