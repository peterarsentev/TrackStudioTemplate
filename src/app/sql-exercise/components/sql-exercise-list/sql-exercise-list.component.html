<div class="container py-4">
  <div class="card-glass rounded-4 shadow-sm overflow-hidden">

    <!-- Header -->
    <div class="px-3 px-md-4 py-3 border-bottom border-soft">
      <div class="fw-semibold  d-flex align-items-center gap-2">
        <i class="bi bi-list-task"></i>
        Упражнений:
        <span class="fw-bold">{{ exercises.length }}</span>
      </div>
    </div>

    <!-- List (no table) -->
    <div class="px-3 px-md-4 py-3 d-flex flex-column gap-2">

      <div
        *ngFor="let exercise of exercises"
        class="card-glass rounded-3 p-3 d-flex align-items-start gap-3 hover-glass cursor-pointer"
        (click)="goToExercise(exercise.id)"
      >
        <i class="bi bi-list-check text-muted-soft mt-1"></i>

        <div class="min-w-0 flex-grow-1">
          <div class="fw-semibold ">
            {{ exercise.title }}
          </div>

          <div class="small text-muted-soft d-flex flex-wrap gap-2 mt-1">
            <span
              class="badge rounded-pill"
              [ngClass]="{
                'badge-good': exercise.status === 'COMPLETE',
                'badge-accent': exercise.status === 'NEW',
                'badge-warn': exercise.status === 'PROGRESS',
                'badge-glass': !exercise.status
              }"
            >
              {{
                exercise.status === 'COMPLETE'
                  ? 'Выполнено'
                  : exercise.status === 'NEW'
                  ? 'Новая'
                  : exercise.status === 'PROGRESS'
                  ? 'В процессе'
                  : '—'
              }}
            </span>
          </div>
        </div>
      </div>

      <!-- Empty -->
      <div *ngIf="!exercises?.length" class="text-center text-muted-soft py-4">
        Упражнений пока нет
      </div>

    </div>

  </div>
</div>
